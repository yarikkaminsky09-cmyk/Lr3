    <main>
        <h1>Запис на прийом до ветлікарні</h1>
        <a href="main.html">Назад на головну</a>
        <form action="#" method="post">
            <p>
                <label for="username">Ваше ім'я:</label>
                <input type="text" id="username" name="username" required>
            </p>            
            <p>
                <label for="pet-type">Виберіть тваринку:</label>
                <select id="pet-type" name="pet-type">
                    <option value="dog">Собака</option>
                    <option value="cat">Кіт</option>
                    <option value="rabbit">Кролик</option>
                    <option value="other">Інше</option>
                </select>
            </p>
            <p>
                <label for="date">Дата візиту:</label>
                <input type="date" id="date" name="visit-date" required>
            </p>
            <p>
                <label for="comments">Скарги / Коментар:</label>
                <textarea id="comments" name="comments" rows="4" cols="30" placeholder="Опишіть проблему..."></textarea>
            </p>
            <p>
                <input type="submit" value="Надіслати заявку">
            </p>
        </form>
    </main>
